<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindustan Seal | Contact Wireframe</title>
    <style>
        /* Wireframe Styles */
        body {
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        * {
            box-sizing: border-box;
        }

        .wf-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Generic Box for placeholders */
        .wf-box {
            border: 2px solid #555;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #555;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        /* Typography Placeholders */
        .wf-text-line {
            height: 16px;
            background-color: #ccc;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .wf-text-line.short { width: 40%; }
        .wf-text-line.medium { width: 70%; }
        .wf-text-line.long { width: 100%; }

        .wf-title {
            height: 32px;
            background-color: #999;
            margin-bottom: 15px;
            width: 50%;
            border-radius: 4px;
        }

        .wf-button {
            display: inline-block;
            padding: 10px 20px;
            border: 2px solid #555;
            border-radius: 20px;
            background-color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            margin: 5px;
            text-align: center;
        }

        /* Navbar */
        .wf-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 2px solid #555;
            background-color: #fff;
        }
        .wf-nav-logo {
            width: 150px;
            height: 40px;
        }
        .wf-nav-links {
            display: flex;
            gap: 15px;
        }
        .wf-nav-link {
            width: 60px;
            height: 15px;
            background-color: #ccc;
            border-radius: 4px;
        }

        /* Grid Layouts */
        .wf-row {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            margin-bottom: 60px;
        }
        .wf-col-2 {
            flex: 1 1 calc(50% - 20px);
            min-width: 300px;
        }

        /* Form Inputs */
        .wf-input {
            width: 100%;
            height: 40px;
            border: 2px solid #ccc;
            border-radius: 4px;
            margin-bottom: 20px;
            background-color: #fff;
        }
        .wf-textarea {
            width: 100%;
            height: 120px;
            border: 2px solid #ccc;
            border-radius: 4px;
            margin-bottom: 20px;
            background-color: #fff;
        }

        /* Footer */
        .wf-footer {
            border-top: 2px solid #555;
            padding: 40px 20px;
            text-align: center;
            background-color: #eee;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="wf-nav">
        <div class="wf-box wf-nav-logo">Logo Placeholder</div>
        <div class="wf-nav-links">
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link" style="background-color: #555;"></div> <!-- Active -->
        </div>
    </header>

    <div class="wf-container">
        <!-- Hero Section -->
        <section style="text-align: center; margin: 80px 0;">
            <div class="wf-button" style="padding: 5px 10px; font-size: 10px; margin-bottom: 20px;">Connect With Us Badge</div>
            <div class="wf-title" style="margin: 0 auto 20px auto; width: 40%; height: 40px;"></div>
            <div class="wf-text-line medium" style="margin: 0 auto 40px auto;"></div>
        </section>

        <!-- Contact Section -->
        <section class="wf-row">
            <!-- Contact Info -->
            <div class="wf-col-2 wf-box" style="flex-direction: column; align-items: flex-start; padding: 40px; background-color: #fff;">
                <div class="wf-title" style="width: 60%; height: 24px; margin-bottom: 30px;">Contact Information</div>
                
                <div style="display: flex; margin-bottom: 30px; width: 100%;">
                    <div class="wf-box" style="width: 50px; height: 50px; border-radius: 50%; margin-right: 20px;">I</div>
                    <div style="flex-grow: 1;">
                        <div class="wf-text-line short" style="height: 20px;"></div>
                        <div class="wf-text-line long"></div>
                        <div class="wf-text-line medium"></div>
                    </div>
                </div>

                <div style="display: flex; margin-bottom: 30px; width: 100%;">
                    <div class="wf-box" style="width: 50px; height: 50px; border-radius: 50%; margin-right: 20px;">I</div>
                    <div style="flex-grow: 1;">
                        <div class="wf-text-line short" style="height: 20px;"></div>
                        <div class="wf-text-line medium"></div>
                        <div class="wf-text-line medium"></div>
                    </div>
                </div>

                <div style="display: flex; width: 100%;">
                    <div class="wf-box" style="width: 50px; height: 50px; border-radius: 50%; margin-right: 20px;">I</div>
                    <div style="flex-grow: 1;">
                        <div class="wf-text-line short" style="height: 20px;"></div>
                        <div class="wf-text-line medium"></div>
                    </div>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="wf-col-2 wf-box" style="flex-direction: column; align-items: flex-start; padding: 40px; background-color: #fff;">
                <div class="wf-title" style="width: 60%; height: 24px; margin-bottom: 30px;">Send a Message</div>
                
                <div class="wf-text-line short" style="margin-bottom: 5px;"></div>
                <div class="wf-input"></div>

                <div class="wf-text-line short" style="margin-bottom: 5px;"></div>
                <div class="wf-input"></div>

                <div class="wf-text-line short" style="margin-bottom: 5px;"></div>
                <div class="wf-textarea"></div>

                <div class="wf-button" style="width: 100%; padding: 15px;">Submit Inquiry</div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="wf-footer">
        <div class="wf-box" style="width: 100px; height: 50px; margin: 0 auto 20px auto;">Logo</div>
        <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 30px;">
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
        </div>
        <div class="wf-text-line medium" style="margin: 0 auto 10px auto;"></div>
        <div class="wf-text-line short" style="margin: 0 auto 30px auto;"></div>
        
        <hr style="border: none; border-top: 2px solid #ccc; width: 80%; margin: 0 auto 20px auto;">
        
        <div class="wf-text-line short" style="margin: 0 auto; width: 20%;"></div>
    </footer>

</body>
</html>
