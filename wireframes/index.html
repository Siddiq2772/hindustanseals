<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindustan Seal | Wireframe</title>
    <style>
        /* Wireframe Styles */
        body {
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif; /* Sketchy feel */
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        * {
            box-sizing: border-box;
        }

        .wf-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Generic Box for placeholders */
        .wf-box {
            border: 2px solid #555;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #555;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        /* Image Placeholder with 'X' */
        .wf-img {
            background-color: #ddd;
        }
        .wf-img::before, .wf-img::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-top: 2px solid #aaa;
            transform-origin: top left;
        }
        .wf-img::before {
            transform: rotate(calc(atan(var(--h) / var(--w))));
            width: calc(sqrt(var(--w)*var(--w) + var(--h)*var(--h)) * 1px);
        }
        .wf-img::after {
            transform: rotate(calc(-1 * atan(var(--h) / var(--w)))) translateY(calc(var(--h) * 1px));
            width: calc(sqrt(var(--w)*var(--w) + var(--h)*var(--h)) * 1px);
        }

        /* Typography Placeholders */
        .wf-text-line {
            height: 16px;
            background-color: #ccc;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .wf-text-line.short { width: 40%; }
        .wf-text-line.medium { width: 70%; }
        .wf-text-line.long { width: 100%; }

        .wf-title {
            height: 32px;
            background-color: #999;
            margin-bottom: 15px;
            width: 50%;
            border-radius: 4px;
        }

        .wf-button {
            display: inline-block;
            padding: 10px 20px;
            border: 2px solid #555;
            border-radius: 20px;
            background-color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            margin: 5px;
        }

        /* Sections */
        /* Navbar */
        .wf-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 2px solid #555;
            background-color: #fff;
        }
        .wf-nav-logo {
            width: 150px;
            height: 40px;
        }
        .wf-nav-links {
            display: flex;
            gap: 15px;
        }
        .wf-nav-link {
            width: 60px;
            height: 15px;
            background-color: #ccc;
            border-radius: 4px;
        }

        /* Hero */
        .wf-hero {
            height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #555;
        }
        .wf-hero-branding {
            width: 80%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border: 2px solid #555;
            text-align: center;
        }

        /* Grid Layouts */
        .wf-row {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            margin-bottom: 60px;
        }
        .wf-col-2 {
            flex: 1 1 calc(50% - 20px);
            min-width: 300px;
        }
        .wf-col-3 {
            flex: 1 1 calc(33.333% - 27px);
            min-width: 250px;
        }

        /* Products alternating */
        .wf-product-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 40px;
            margin-bottom: 40px;
        }
        .wf-product-row.reverse {
            flex-direction: row-reverse;
        }
        .wf-product-img {
            flex: 1 1 calc(50% - 20px);
            height: 300px;
            min-width: 300px;
        }
        .wf-product-info {
            flex: 1 1 calc(50% - 20px);
            min-width: 300px;
        }

        /* Footer */
        .wf-footer {
            border-top: 2px solid #555;
            padding: 40px 20px;
            text-align: center;
            background-color: #eee;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="wf-nav">
        <div class="wf-box wf-nav-logo">Logo Placeholder</div>
        <div class="wf-nav-links">
            <div class="wf-nav-link" style="background-color: #555;"></div> <!-- Active -->
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
            <div class="wf-button">CTA Button</div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="wf-box wf-img wf-hero">
        <span style="position: absolute; top: 10px; left: 10px; background: #fff; padding: 2px 5px; border: 1px solid #000; font-size: 10px; z-index: 2;">Hero Slideshow Image Area</span>
        <div class="wf-hero-branding" style="z-index: 1;">
            <div class="wf-title" style="margin: 0 auto 20px auto; width: 80%;"></div>
            <div class="wf-text-line long"></div>
            <div class="wf-text-line medium" style="margin: 0 auto 20px auto;"></div>
            <div class="wf-button">Analyze Matches</div>
            <div class="wf-button">View Catalog</div>
        </div>
    </section>

    <div class="wf-container">
        <!-- About Section -->
        <section class="wf-row" style="margin-top: 60px;">
            <div class="wf-col-2">
                <div class="wf-button" style="padding: 5px 10px; font-size: 10px; margin-bottom: 20px; display: inline-block;">Badge</div>
                <div class="wf-title" style="width: 90%;"></div>
                <div class="wf-title" style="width: 70%; margin-bottom: 30px;"></div>
                
                <div class="wf-text-line long"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line medium"></div>
                
                <br>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line short"></div>

                <div style="display: flex; gap: 30px; margin-top: 30px;">
                    <div>
                        <div class="wf-title" style="width: 60px; height: 24px;"></div>
                        <div class="wf-text-line short" style="width: 100px;"></div>
                    </div>
                    <div>
                        <div class="wf-title" style="width: 60px; height: 24px;"></div>
                        <div class="wf-text-line short" style="width: 100px;"></div>
                    </div>
                </div>
            </div>
            <div class="wf-col-2">
                <div class="wf-box wf-img" style="height: 400px;">
                    Facility Image Placeholder
                </div>
            </div>
        </section>

        <!-- Product Overview Header -->
        <div style="text-align: center; margin: 80px 0 40px 0;">
            <div class="wf-title" style="margin: 0 auto 20px auto; width: 40%;"></div>
            <div class="wf-text-line medium" style="margin: 0 auto;"></div>
            <div class="wf-text-line short" style="margin: 0 auto;"></div>
        </div>

        <!-- Product 1 -->
        <div class="wf-product-row">
            <div class="wf-box wf-img wf-product-img">Product Image 1</div>
            <div class="wf-product-info">
                <div class="wf-title"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line medium" style="margin-bottom: 30px;"></div>
                <div class="wf-button">View Collection</div>
            </div>
        </div>

        <!-- Product 2 (Reversed) -->
        <div class="wf-product-row reverse">
            <div class="wf-box wf-img wf-product-img">Product Image 2</div>
            <div class="wf-product-info">
                <div class="wf-title"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line medium" style="margin-bottom: 30px;"></div>
                <div class="wf-button">View Collection</div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="wf-product-row">
            <div class="wf-box wf-img wf-product-img">Product Image 3</div>
            <div class="wf-product-info">
                <div class="wf-title"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line medium" style="margin-bottom: 30px;"></div>
                <div class="wf-button">View Collection</div>
            </div>
        </div>

        <!-- Product 4 (Reversed) -->
        <div class="wf-product-row reverse">
            <div class="wf-box wf-img wf-product-img">Product Image 4</div>
            <div class="wf-product-info">
                <div class="wf-title"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line medium" style="margin-bottom: 30px;"></div>
                <div class="wf-button">View Collection</div>
            </div>
        </div>

        <!-- Features Grid -->
        <section class="wf-row" style="margin-top: 80px;">
            <div class="wf-col-3 wf-box" style="height: 150px; flex-direction: column; align-items: flex-start; padding: 20px;">
                <div class="wf-title" style="width: 80%; height: 24px;"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line medium"></div>
            </div>
            <div class="wf-col-3 wf-box" style="height: 150px; flex-direction: column; align-items: flex-start; padding: 20px;">
                <div class="wf-title" style="width: 80%; height: 24px;"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line medium"></div>
            </div>
            <div class="wf-col-3 wf-box" style="height: 150px; flex-direction: column; align-items: flex-start; padding: 20px;">
                <div class="wf-title" style="width: 80%; height: 24px;"></div>
                <div class="wf-text-line long"></div>
                <div class="wf-text-line medium"></div>
            </div>
        </section>

    </div>

    <!-- Footer -->
    <footer class="wf-footer">
        <div class="wf-box" style="width: 100px; height: 50px; margin: 0 auto 20px auto;">Logo</div>
        <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 30px;">
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
        </div>
        <div class="wf-text-line medium" style="margin: 0 auto 10px auto;"></div>
        <div class="wf-text-line short" style="margin: 0 auto 30px auto;"></div>
        
        <hr style="border: none; border-top: 2px solid #ccc; width: 80%; margin: 0 auto 20px auto;">
        
        <div class="wf-text-line short" style="margin: 0 auto; width: 20%;"></div>
    </footer>

</body>
</html>
