<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindustan Seal | Product Wireframe</title>
    <style>
        /* Wireframe Styles */
        body {
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        * {
            box-sizing: border-box;
        }

        .wf-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Generic Box for placeholders */
        .wf-box {
            border: 2px solid #555;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #555;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        /* Typography Placeholders */
        .wf-text-line {
            height: 16px;
            background-color: #ccc;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .wf-text-line.short { width: 40%; }
        .wf-text-line.medium { width: 70%; }
        .wf-text-line.long { width: 100%; }

        .wf-title {
            height: 32px;
            background-color: #999;
            margin-bottom: 15px;
            width: 50%;
            border-radius: 4px;
        }

        .wf-button {
            display: inline-block;
            padding: 10px 20px;
            border: 2px solid #555;
            border-radius: 20px;
            background-color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            margin: 5px;
        }

        /* Navbar */
        .wf-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 2px solid #555;
            background-color: #fff;
        }
        .wf-nav-logo {
            width: 150px;
            height: 40px;
        }
        .wf-nav-links {
            display: flex;
            gap: 15px;
        }
        .wf-nav-link {
            width: 60px;
            height: 15px;
            background-color: #ccc;
            border-radius: 4px;
        }

        /* Grid Layouts */
        .wf-row {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            margin-bottom: 60px;
        }
        .wf-col-4 {
            flex: 1 1 calc(25% - 30px);
            min-width: 200px;
        }

        /* Footer */
        .wf-footer {
            border-top: 2px solid #555;
            padding: 40px 20px;
            text-align: center;
            background-color: #eee;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="wf-nav">
        <div class="wf-box wf-nav-logo">Logo Placeholder</div>
        <div class="wf-nav-links">
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link" style="background-color: #555;"></div> <!-- Active -->
            <div class="wf-nav-link"></div>
        </div>
    </header>

    <div class="wf-container">
        <!-- Hero Section -->
        <section style="text-align: center; margin: 80px 0;">
            <div class="wf-button" style="padding: 5px 10px; font-size: 10px; margin-bottom: 20px;">Product Catalog Badge</div>
            <div class="wf-title" style="margin: 0 auto 20px auto; width: 60%; height: 40px;"></div>
            <div class="wf-text-line medium" style="margin: 0 auto 40px auto;"></div>
            <div class="wf-button"><- Back Home</div>
        </section>

        <!-- Services / Categories Grid -->
        <section class="wf-row">
            <!-- Category 1 -->
            <div class="wf-col-4 wf-box" style="height: 250px; flex-direction: column; padding: 20px;">
                <div class="wf-title" style="width: 80%; height: 24px; margin-bottom: 30px;"></div>
                <div class="wf-button" style="width: 80%;">View Category</div>
            </div>
            <!-- Category 2 -->
            <div class="wf-col-4 wf-box" style="height: 250px; flex-direction: column; padding: 20px;">
                <div class="wf-title" style="width: 80%; height: 24px; margin-bottom: 30px;"></div>
                <div class="wf-button" style="width: 80%;">View Category</div>
            </div>
            <!-- Category 3 -->
            <div class="wf-col-4 wf-box" style="height: 250px; flex-direction: column; padding: 20px;">
                <div class="wf-title" style="width: 80%; height: 24px; margin-bottom: 30px;"></div>
                <div class="wf-button" style="width: 80%;">View Category</div>
            </div>
            <!-- Category 4 -->
            <div class="wf-col-4 wf-box" style="height: 250px; flex-direction: column; padding: 20px;">
                <div class="wf-title" style="width: 80%; height: 24px; margin-bottom: 30px;"></div>
                <div class="wf-button" style="width: 80%;">View Category</div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="wf-footer">
        <div class="wf-box" style="width: 100px; height: 50px; margin: 0 auto 20px auto;">Logo</div>
        <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 30px;">
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
            <div class="wf-nav-link"></div>
        </div>
        <div class="wf-text-line medium" style="margin: 0 auto 10px auto;"></div>
        <div class="wf-text-line short" style="margin: 0 auto 30px auto;"></div>
        
        <hr style="border: none; border-top: 2px solid #ccc; width: 80%; margin: 0 auto 20px auto;">
        
        <div class="wf-text-line short" style="margin: 0 auto; width: 20%;"></div>
    </footer>

</body>
</html>
